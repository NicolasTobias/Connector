name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Versión de Swift
        run: swift --version
      - name: Tests
        run: swift run connector-tests
      - name: Empaquetado de prueba
        run: |
          scripts/build-app.sh
          scripts/make-dmg.sh
          hdiutil verify dist/Connector-*.dmg
      - name: Subir dmg como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: Connector-dmg
          path: dist/Connector-*.dmg
          if-no-files-found: error
          retention-days: 30
